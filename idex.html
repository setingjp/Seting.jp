<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seting Jackpot PanenWD89</title>
    <style>
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        
        /* DESAIN UNTUK HALAMAN SEBELUM PROSES */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h2 {
            color: #94a3b8;
            font-size: 18px;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        
        .header h1 {
            background: linear-gradient(to bottom, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
            margin: 0;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 8px rgba(255,255,255,0.1));
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .input-field {
            width: 100%;
            padding: 16px;
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #475569;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            border-color: #38bdf8;
            background-color: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        
        .jackpot-option {
            display: block;
            position: relative;
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .jackpot-option:hover {
            background-color: rgba(45, 55, 72, 0.8);
            border-color: #64748b;
        }
        
        .jackpot-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        
        .option-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-right: 35px;
        }
        
        .deposit-text {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .jackpot-text {
            display: block;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
        }
        
        .checkmark {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            height: 22px;
            width: 22px;
            border: 2px solid #475569;
            border-radius: 50%;
        }
        
        .jackpot-option input[type="radio"]:checked ~ .checkmark {
            border-color: #38bdf8;
            background-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
        
        .jackpot-option input[type="radio"]:checked ~ .option-content .jackpot-text {
            color: #38bdf8;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0284c7 0%, #0369a1 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        
        .btn-submit:hover {
            background: linear-gradient(90deg, #0ea5e9 0%, #0284c7 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5);
        }
        
        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* DESAIN KHUSUS TAMPILAN BARU (SETELAH BERHASIL) */
        #suksesContainer {
            display: none; /* Tersembunyi otomatis di awal */
            text-align: center;
            padding: 50px 10px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .icon-sukses {
            width: 90px;
            height: 90px;
            background: rgba(34, 197, 94, 0.1);
            border: 3px solid #22c55e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px auto;
            color: #22c55e;
            font-size: 45px;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
        }
        
        .status-sukses {
            color: #22c55e;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            margin-bottom: 15px;
        }

        .sub-status {
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ==================== TAMPILAN SEBELUM PROSES ==================== -->
    <div id="tampilanLama">
        <div class="header">
            <h2>Seting Jackpot</h2>
            <h1>PANENWD89</h1>
        </div>

        <form id="jackpotForm">
            <div class="form-group">
                <label for="userId">USER ID:</label>
                <input type="text" id="userId" class="input-field" placeholder="Masukkan User ID..." required>
            </div>

            <div class="form-group">
                <label>PILIH TINGKATAN:</label>

                <!-- Opsi 1 -->
                <label class="jackpot-option">
                    <input type="radio" name="jackpot_setting" value="1" required>
                    <span class="checkmark"></span>
                    <span class="option-content">
                        <span>
                            <span class="deposit-text">1. Deposit 100-300</span>
                            <span class="jackpot-text">JACKPOT 1,5jta-3jta</span>
                        </span>
                    </span>
                </label>

                <!-- Opsi 2 -->
                <label class="jackpot-option">
                    <input type="radio" name="jackpot_setting" value="2">
                    <span class="checkmark"></span>
                    <span class="option-content">
                        <span>
                            <span class="deposit-text">2. Deposit 400-600</span>
                            <span class="jackpot-text">JACKPOT 3,5jta-6jta</span>
                        </span>
                    </span>
                </label>

                <!-- Opsi 3 -->
                <label class="jackpot-option">
                    <input type="radio" name="jackpot_setting" value="3">
                    <span class="checkmark"></span>
                    <span class="option-content">
                        <span>
                            <span class="deposit-text">3. Deposit 700-1jta</span>
                            <span class="jackpot-text">JACKPOT 7jta-10jta</span>
                        </span>
                    </span>
                </label>

                <!-- Opsi 4 -->
                <label class="jackpot-option">
                    <input type="radio" name="jackpot_setting" value="4">
                    <span class="checkmark"></span>
                    <span class="option-content">
                        <span>
                            <span class="deposit-text">4. Deposit 1,5jta-2jta</span>
                            <span class="jackpot-text">JACKPOT 10,5jta-20jta</span>
                        </span>
                    </span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">PROSES SYSTEM</button>
        </form>
    </div>
    <!-- ==================== END TAMPILAN SEBELUM PROSES ==================== -->


    <!-- ==================== TAMPILAN BARU (SETELAH SUKSES) ==================== -->
    <div id="suksesContainer">
        <div class="icon-sukses">✓</div>
        <div class="status-sukses">SETINGAN JACKPOT BERHASIL</div>
        <div class="sub-status">Sistem akun ID Anda telah berhasil dikonfigurasi ulang ke server pusat.</div>
    </div>
    <!-- ==================== END TAMPILAN BARU ==================== -->

</div>

<script>
    document.getElementById('jackpotForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah refresh halaman alami browser
        
        const tampilanLama = document.getElementById('tampilanLama');
        const submitBtn = document.getElementById('submitBtn');
        const suksesContainer = document.getElementById('suksesContainer');
        
        // Memulai proses simulasi loading sistem
        submitBtn.disabled = true;
        submitBtn.innerText = "MEMPROSES SYSTEM...";
        
        setTimeout(() => {
            // STEP 1: Hilangkan/Sembunyikan TOTAL seluruh isi tampilan lama (termasuk logo header)
            tampilanLama.style.display = "none";
            
            // STEP 2: Munculkan tampilan pesan baru yang sukses secara penuh di dalam box kontainer
            suksesContainer.style.display = "block";
        }, 1500); // Penundaan loading 1.5 detik agar terlihat sistem sedang bekerja
    });
</script>

</body>
</html>
